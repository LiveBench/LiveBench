# DSv4-Flash sftv33 (action-masked SFT on base: thinking present in context but
# loss-masked; loss only on tool_call rows), self-hosted vLLM on
# internal-llm-ft-001.reai.io — root DSv4-Flash-v33-servefp8, dedicated alias.
# NOTE: v33's thinking-silence is dose-dependent on long multi-turn context
# (empty-think conditioning, see v3.4 root cause) — short prompts DO emit
# reasoning_content (verified on this serving 2026-08-15); expect it to fade as
# agentic turns accumulate. reasoning_effort=max sent and accepted.
display_name: dsv4-flash-sftv33
# DeepSeek published API rates, matching the smaug-flash / di-fp4 entries so cost columns compare.
cost_per_million:
  input: 0.14
  cached_input: 0.0028
  output: 0.28
api_name:
  selfhost_vllm: dsv4-flash-sftv33
default_provider: selfhost_vllm
api_base: http://internal-llm-ft-001.reai.io:30310/v1
api_kwargs:
  default:
    temperature: null
    timeout: 1800
    api_key: EMPTY
    reasoning_effort: max
    allowed_openai_params:
      - reasoning_effort
preserve_reasoning: true
