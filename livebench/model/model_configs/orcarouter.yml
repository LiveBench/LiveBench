# OrcaRouter Models
# OpenAI-compatible routing gateway (https://www.orcarouter.ai) exposing
# namespaced model ids behind a single base URL and one API key. Cost figures
# mirror LiveBench's first-party entries for the same upstream models.
---
display_name: orcarouter-gpt-5.5
cost_per_million:
  input: 5
  cached_input: 0.5
  output: 30
api_name:
  https://api.orcarouter.ai/v1: openai/gpt-5.5
default_provider: https://api.orcarouter.ai/v1
api_keys:
  https://api.orcarouter.ai/v1: ORCAROUTER_API_KEY
api_kwargs:
  default:
    temperature: null
    max_completion_tokens: null
